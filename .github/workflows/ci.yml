name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-build-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Secret scan (checksum-pinned gitleaks)
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --exit-code 1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.10.11

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime.txt" >/dev/null
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/runtime.txt"

      - name: Run tests
        run: uv run --locked python -m pytest

      - name: Compile source
        run: uv run --locked python -m compileall src

      - name: Build package
        run: uv build

      - name: Verify dist metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          twine check dist/*

  desktop:
    runs-on: macos-latest
    steps:
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.10.11
      - run: uv sync --locked --extra dev
      - run: uv run --locked python -m pytest
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - run: uv run --locked python scripts/build_mcpb.py
      - run: uv run --locked python scripts/smoke_desktop.py dist/desktop/flin-google-keyword-planner-mcp.mcpb --local-source
